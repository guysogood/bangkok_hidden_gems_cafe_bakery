<svg width="740" height="310" viewBox="0 0 740 310" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Bangkok cafe and bakery hidden gem finder pipeline architecture on GCP</title>
<style>
  .box { fill: #ffffff; stroke: #d0d5dd; stroke-width: 1; }
  .box-gray   { fill: #f2f4f7; }
  .box-purple { fill: #f4f3ff; }
  .box-teal   { fill: #ecfdf3; }
  .box-amber  { fill: #fffbeb; }
  .dag-bg { fill: #f9fafb; stroke: #d0d5dd; stroke-width: 1; stroke-dasharray: 5 3; }
  .th { font: 600 13px sans-serif; fill: #1d2939; }
  .ts { font: 400 11px sans-serif; fill: #475467; }
  .label { font: 500 11px sans-serif; fill: #667085; }
  .arrow { stroke: #98a2b3; stroke-width: 1.2; fill: none; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#98a2b3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Section label -->
<text class="label" x="22" y="20">Manual ingestion</text>

<!-- Airflow DAG background -->
<rect class="dag-bg" x="10" y="192" width="718" height="98" rx="8"/>
<text class="label" x="22" y="209">Airflow DAG · @weekly</text>

<!-- ── Row 1: Manual ingestion ── -->

<g>
  <rect class="box box-gray" x="20" y="38" width="130" height="50" rx="8"/>
  <text class="th" x="85" y="55" text-anchor="middle" dominant-baseline="central">Source</text>
  <text class="ts" x="85" y="72" text-anchor="middle" dominant-baseline="central">Google Places API</text>
</g>

<g>
  <rect class="box box-gray" x="168" y="38" width="130" height="50" rx="8"/>
  <text class="th" x="233" y="55" text-anchor="middle" dominant-baseline="central">Ingestion</text>
  <text class="ts" x="233" y="72" text-anchor="middle" dominant-baseline="central">manual run only</text>
</g>

<g>
  <rect class="box box-teal" x="316" y="38" width="120" height="50" rx="8"/>
  <text class="th" x="376" y="55" text-anchor="middle" dominant-baseline="central">Bronze</text>
  <text class="ts" x="376" y="72" text-anchor="middle" dominant-baseline="central">Cloud Storage</text>
</g>

<line class="arrow" x1="150" y1="63" x2="166" y2="63" marker-end="url(#arrow)"/>
<line class="arrow" x1="298" y1="63" x2="314" y2="63" marker-end="url(#arrow)"/>

<!-- Bronze → bronze_to_silver (down and across) -->
<path class="arrow" d="M376 88 L376 152 L82 152 L82 218" marker-end="url(#arrow)"/>

<!-- ── Row 2: Airflow DAG tasks ── -->

<g>
  <rect class="box box-purple" x="20" y="220" width="125" height="50" rx="8"/>
  <text class="th" x="82" y="237" text-anchor="middle" dominant-baseline="central">bronze_to_silver</text>
  <text class="ts" x="82" y="254" text-anchor="middle" dominant-baseline="central">PySpark local</text>
</g>

<g>
  <rect class="box box-amber" x="153" y="220" width="80" height="50" rx="8"/>
  <text class="th" x="193" y="237" text-anchor="middle" dominant-baseline="central">validate</text>
  <text class="ts" x="193" y="254" text-anchor="middle" dominant-baseline="central">silver</text>
</g>

<g>
  <rect class="box box-purple" x="241" y="220" width="125" height="50" rx="8"/>
  <text class="th" x="303" y="237" text-anchor="middle" dominant-baseline="central">silver_to_gold</text>
  <text class="ts" x="303" y="254" text-anchor="middle" dominant-baseline="central">PySpark local</text>
</g>

<g>
  <rect class="box box-amber" x="374" y="220" width="80" height="50" rx="8"/>
  <text class="th" x="414" y="237" text-anchor="middle" dominant-baseline="central">validate</text>
  <text class="ts" x="414" y="254" text-anchor="middle" dominant-baseline="central">gold</text>
</g>

<g>
  <rect class="box box-purple" x="462" y="220" width="125" height="50" rx="8"/>
  <text class="th" x="524" y="237" text-anchor="middle" dominant-baseline="central">load_to_bigquery</text>
  <text class="ts" x="524" y="254" text-anchor="middle" dominant-baseline="central">BQ loader</text>
</g>

<g>
  <rect class="box box-teal" x="595" y="220" width="115" height="50" rx="8"/>
  <text class="th" x="652" y="237" text-anchor="middle" dominant-baseline="central">Warehouse</text>
  <text class="ts" x="652" y="254" text-anchor="middle" dominant-baseline="central">BigQuery</text>
</g>

<line class="arrow" x1="145" y1="245" x2="151" y2="245" marker-end="url(#arrow)"/>
<line class="arrow" x1="233" y1="245" x2="239" y2="245" marker-end="url(#arrow)"/>
<line class="arrow" x1="366" y1="245" x2="372" y2="245" marker-end="url(#arrow)"/>
<line class="arrow" x1="454" y1="245" x2="460" y2="245" marker-end="url(#arrow)"/>
<line class="arrow" x1="587" y1="245" x2="593" y2="245" marker-end="url(#arrow)"/>

</svg>
